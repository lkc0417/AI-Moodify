
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moodify</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d20;color:white;font-family:Arial,sans-serif;text-align:center;padding:25px 15px}
h1{font-size:42px;color:#c5a5ff}
.card{max-width:460px;margin:20px auto;background:#211b38;padding:22px;border-radius:22px}
textarea{width:100%;height:90px;padding:12px;border-radius:12px;font-size:16px}
button{background:#9064e8;color:white;border:0;padding:13px 18px;border-radius:12px;margin:6px;cursor:pointer}
.song{background:#382c52;padding:13px;margin:10px 0;border-radius:12px;text-align:left}
audio{width:100%;margin-top:15px}
</style>
</head>
<body>
<h1>🎧 Moodify</h1>
<p>Your mood, your music.</p>

<div class="card">
<h2>💜 오늘 기분은?</h2>
<textarea id="feeling" placeholder="오늘 기분을 적어줘..."></textarea>
<br>
<button onclick="analyze()">✨ 감정 분석하기</button>
<div id="result"></div>
</div>

<div class="card">
<h2>🎵 Mood Music</h2>
<div id="songs">기분을 분석하면 음악을 추천할게!</div>
<audio id="player" controls></audio>
<p id="playing">음악을 선택해 줘.</p>
</div>

<script>
const music={
happy:[
{name:"밝은 분위기의 무료 음악",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"}
],
sad:[
{name:"차분한 분위기의 음악",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"}
],
tired:[
{name:"편안한 분위기의 음악",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"}
],
excited:[
{name:"신나는 분위기의 음악",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"}
]
};

function analyze(){
const t=document.getElementById("feeling").value.trim();
if(!t){alert("기분을 적어줘!");return;}

let mood="happy",label="행복";
if(/슬프|우울|외로|속상/.test(t)){mood="sad";label="슬픔";}
else if(/피곤|졸려|지쳐/.test(t)){mood="tired";label="피곤";}
else if(/신나|즐거|설레|기대/.test(t)){mood="excited";label="신남";}

document.getElementById("result").innerHTML=
"<h3>💜 분석 결과: "+label+"</h3><p>이 기분에 어울리는 음악을 골랐어!</p>";

const list=document.getElementById("songs");
list.innerHTML="";
music[mood].forEach(song=>{
const b=document.createElement("button");
b.className="song";
b.textContent="▶ "+song.name;
b.style.width="100%";
b.onclick=()=>{
const p=document.getElementById("player");
p.src=song.url;
p.play();
document.getElementById("playing").textContent="🎶 "+song.name;
};
list.appendChild(b);
});
}
</script>
</body>
</html>
